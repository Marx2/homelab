# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app firecrawl
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

    controllers:
      api:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/firecrawl
              tag: 2.11@sha256:99126b8367f8f11f11de3a991cc095d3265bffc756ed41690dbb3d8acb5b7396
            command: ["node", "--max-old-space-size=6144", "dist/src/index.js"]
            env:
              FLY_PROCESS_GROUP: app
              PORT: "3002"
              REDIS_URL: redis://firecrawl-redis.home.svc.cluster.local:6379
              REDIS_RATE_LIMIT_URL: redis://firecrawl-redis.home.svc.cluster.local:6379
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.home.svc.cluster.local:3000/scrape
              USE_DB_AUTHENTICATION: "false"
              ENV: production
              LOGGING_LEVEL: INFO
              IS_KUBERNETES: "true"
              HOST: 0.0.0.0
            envFrom:
              - secretRef:
                  name: firecrawl-env
            ports:
              - name: http
                containerPort: 3002
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v0/health/liveness
                    port: 3002
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v0/health/readiness
                    port: 3002
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2
                memory: 6Gi

      worker:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/firecrawl
              tag: 2.11@sha256:99126b8367f8f11f11de3a991cc095d3265bffc756ed41690dbb3d8acb5b7396
            command: ["node", "--max-old-space-size=3072", "dist/src/services/queue-worker.js"]
            env:
              FLY_PROCESS_GROUP: worker
              PORT: "3005"
              REDIS_URL: redis://firecrawl-redis.home.svc.cluster.local:6379
              REDIS_RATE_LIMIT_URL: redis://firecrawl-redis.home.svc.cluster.local:6379
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.home.svc.cluster.local:3000/scrape
              USE_DB_AUTHENTICATION: "false"
              ENV: production
              LOGGING_LEVEL: INFO
              IS_KUBERNETES: "true"
              HOST: 0.0.0.0
              NUQ_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-home-pguser-firecrawl
                    key: uri
            envFrom:
              - secretRef:
                  name: firecrawl-env
            ports:
              - name: http
                containerPort: 3005
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /liveness
                    port: 3005
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1
                memory: 4Gi

      nuq-worker:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/firecrawl
              tag: 2.11@sha256:99126b8367f8f11f11de3a991cc095d3265bffc756ed41690dbb3d8acb5b7396
            command: ["node", "--max-old-space-size=3072", "dist/src/services/worker/nuq-worker.js"]
            env:
              FLY_PROCESS_GROUP: nuq
              NUQ_WORKER_PORT: "3006"
              REDIS_URL: redis://firecrawl-redis.home.svc.cluster.local:6379
              REDIS_RATE_LIMIT_URL: redis://firecrawl-redis.home.svc.cluster.local:6379
              PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright.home.svc.cluster.local:3000/scrape
              USE_DB_AUTHENTICATION: "false"
              ENV: production
              LOGGING_LEVEL: INFO
              IS_KUBERNETES: "true"
              HOST: 0.0.0.0
              NUQ_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-home-pguser-firecrawl
                    key: uri
            envFrom:
              - secretRef:
                  name: firecrawl-env
            ports:
              - name: http
                containerPort: 3006
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3006
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 1
                memory: 4Gi

      playwright-service:
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/firecrawl/playwright-service
              tag: latest@sha256:468009bae00911d40d7120d58489a1d529362c22c45585cb9076094fe61b0025
            env:
              PORT: "3000"
              BLOCK_MEDIA: "true"
              MAX_CONCURRENT_PAGES: "10"
            ports:
              - name: http
                containerPort: 3000
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 3000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: 2
                memory: 4Gi

    service:
      api:
        controller: api
        ports:
          http:
            port: 3002
      playwright:
        controller: playwright-service
        ports:
          http:
            port: 3000

    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      node-cache:
        type: emptyDir
        advancedMounts:
          playwright-service:
            app:
              - path: /home/node/.cache
