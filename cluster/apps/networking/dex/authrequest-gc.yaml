---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dex-authrequest-gc
  namespace: networking
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dex-authrequest-gc
  namespace: networking
rules:
  - apiGroups: ["dex.coreos.com"]
    resources: ["authrequests"]
    verbs: ["list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dex-authrequest-gc
  namespace: networking
subjects:
  - kind: ServiceAccount
    name: dex-authrequest-gc
    namespace: networking
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dex-authrequest-gc
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dex-authrequest-gc
  namespace: networking
  labels:
    app.kubernetes.io/name: dex-authrequest-gc
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: dex-authrequest-gc
    spec:
      activeDeadlineSeconds: 7200
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dex-authrequest-gc
        spec:
          serviceAccountName: dex-authrequest-gc
          automountServiceAccountToken: true
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: kura
          imagePullSecrets:
            - name: regcred
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: python:3.14.5-alpine3.22@sha256:6b91e66ab2a880ce9ca5a1b91c70f45963ff71ff68268df056336e1a657d5efd
              imagePullPolicy: IfNotPresent
              command: ["python3", "/app/authrequest_gc.py"]
              env:
                - name: DEX_NAMESPACE
                  value: networking
                - name: PAGE_SIZE
                  value: "500"
                - name: MAX_DELETES
                  value: "100000"
                - name: DELETE_QPS
                  value: "20"
                - name: HTTP_TIMEOUT_SECONDS
                  value: "30"
                - name: MAX_RETRIES
                  value: "5"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: dex-authrequest-gc-script
                defaultMode: 0444
