---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: networking
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      version: 4.15.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx-charts
        namespace: flux-system
  values:
    # Ingress for non standard ports
    tcp:
      "9982": "media/tvheadend:9982"
    controller:
      ingressClass: nginx
      allowSnippetAnnotations: true
      replicaCount: 1
      service:
        type: LoadBalancer
        loadBalancerIP: "${INGRESS_NGINX_LB}"
        externalTrafficPolicy: Local
        ports:
          http: 80
          https: 443
          htsp: 9982
        targetPorts:
          http: http
          https: https
          htsp: htsp
      config:
        block-user-agents: "AdsBot-Google,Amazonbot,anthropic-ai,Applebot-Extended,Bytespider,CCBot,ChatGPT-User,ClaudeBot,Claude-Web,cohere-ai,Diffbot,FacebookBot,FriendlyCrawler,Google-Extended,GoogleOther,GPTBot,img2dataset,omgili,omgilibot,peer39_crawler,peer39_crawler/1.0,PerplexityBot,YouBot," # taken from https://github.com/ai-robots-txt/ai.robots.txt
        use-geoip2: true
        ssl-protocols: "TLSv1.3 TLSv1.2"
        proxy-body-size: "100m"
        use-forwarded-headers: "true"
        use-proxy-protocol: "false"
        compute-full-forwarded-for: "true"
        forwarded-for-header: X-Forwarded-For
        annotations-risk-level: "Critical"
        http-snippet: |
          proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=leaderboard_cache:1m max_size=10m inactive=10m;
        # proxy-real-ip-cidr: 192.168.1.210
        # §63.11 — DELIBERATELY NOT ENABLED, and the reason is recorded so this
        # is not re-tried as an obvious-looking win.
        #
        # 1. The path is wrong. Every ingress in this cluster that actually
        #    authenticates uses `https://auth.${SECRET_DOMAIN}/oauth2/auth` +
        #    `/oauth2/start` (pgweb, scanst-ui, scanst-otp, stooq, jobshot).
        #    The value commented here is `/api/verify` + bare `/` — a different
        #    endpoint. Uncommenting it as written would 302 every browser
        #    request in every namespace to a URL that does not answer.
        # 2. The blast radius is the whole cluster. This is a controller-wide
        #    default, so it applies to `default`, `home` and `media` at once —
        #    including the KEDA scale-to-zero apps in `default` and every
        #    service that legitimately has no browser login.
        #
        # What §63.11 wanted is now done per app instead, on the two pfire
        # internal tiers that hold provider keys and had no auth at all:
        # `cluster/apps/pfire/{cachest,openst}/app/helmrelease.yaml`.
        # global-auth-url: "https://auth.${SECRET_DOMAIN}/oauth2/auth"
        # global-auth-signin: "https://auth.${SECRET_DOMAIN}/oauth2/start"
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          namespaceSelector:
            any: true
      extraArgs:
        default-ssl-certificate: "networking/${SECRET_DOMAIN/./-}-tls"
      resources:
        requests:
          memory: 100Mi
          cpu: 100m
        limits:
          memory: 500Mi
