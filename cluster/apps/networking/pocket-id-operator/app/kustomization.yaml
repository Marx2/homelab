apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oci-repository.yaml
  - pvc.yaml
  - secret.yaml
  - helmrelease.yaml
patches:
  - patch: |
      - op: replace
        path: /metadata/namespace
        value: flux-system
    target:
      kind: OCIRepository
      name: pocket-id-operator
