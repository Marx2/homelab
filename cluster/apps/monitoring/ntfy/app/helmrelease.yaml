---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ntfy
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      ntfy:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/binwiederhier/ntfy
              tag: v2.28.0
            command:
              - /bin/sh
              - -c
              - |
                printf '%s\n%s\n' "$NTFY_PASSWORD" "$NTFY_PASSWORD" \
                  | ntfy user add --role=admin "$NTFY_ADMIN_USER" 2>/dev/null || true
                exec ntfy serve
            env:
              TZ: "${TZ}"
              NTFY_BASE_URL: "https://ntfy.${SECRET_DOMAIN}"
              NTFY_LISTEN_HTTP: ":8080"
              NTFY_BEHIND_PROXY: "true"
              NTFY_AUTH_FILE: /var/lib/ntfy/user.db
              NTFY_AUTH_DEFAULT_ACCESS: deny-all
              NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
              NTFY_CACHE_DURATION: 12h
              NTFY_CACHE_STARTUP_QUERIES: |
                pragma journal_mode = WAL;
                pragma synchronous = normal;
                pragma temp_store = memory;
                pragma busy_timeout = 15000;
              NTFY_AUTH_STARTUP_QUERIES: |
                pragma journal_mode = WAL;
                pragma synchronous = normal;
                pragma busy_timeout = 15000;
              NTFY_ENABLE_LOGIN: "true"
            envFrom:
              - secretRef:
                  name: ntfy-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: ntfy
        ports:
          http:
            port: *port
    ingress:
      main:
        className: nginx
        annotations:
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
          nginx.ingress.kubernetes.io/server-snippets: |
            location / {
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
            }
          hajimari.io/enable: "true"
          hajimari.io/appName: "Ntfy"
          hajimari.io/icon: "mdi:bell"
          hajimari.io/group: "monitoring"
          hajimari.io/info: Push notification server
        hosts:
          - host: &host "ntfy.${SECRET_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: http
        tls:
          - hosts: [*host]
    persistence:
      data:
        existingClaim: ntfy-data-pvc
        globalMounts:
          - path: /var/lib/ntfy
