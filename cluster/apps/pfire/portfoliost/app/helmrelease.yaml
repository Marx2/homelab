---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths:
          - /spec/containers/resources/limits
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost
              tag: v1.0.356
            env:
              OIDC_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              OIDC_CLIENT_ID: "${PORTFOLIOST_OIDC_CLIENT_ID}"
            # §64.3 — the SPA had no probes at all.
            #
            # READ THIS BEFORE TRUSTING THE PROBE: it covers the static server and
            # nothing else. The container is `serve -s /app/dist -l 80` (PID 1 is
            # node, there is no nginx in the image — the plan text that said
            # "probe nginx" was wrong, and the nginx ingress in front is not what
            # this probe touches).
            #
            # `serve -s` serves real files correctly, and falls back to index.html
            # for any path that does not resolve to one. Measured in PROD
            # 2026-09-29, in-pod and through the ingress:
            #   /                            200 text/html   898 B
            #   /index.html                  200 text/html   898 B
            #   /runtime-config.js           200 application/javascript  189 B
            #   /assets/index-BDN4ASw9.js    200 application/javascript  670094 B
            #   /definitely-not-a-real-asset.js  200 text/html  898 B
            # and that last one is byte-identical to / (same md5). So:
            #
            #   - this probe CAN catch: the static server wedged or not answering,
            #     and /app/dist unreadable.
            #   - this probe CANNOT catch: a missing or corrupt JS/CSS asset, a
            #     bundle that throws at runtime, a broken Vue app, or any API
            #     being down. A missing asset is indistinguishable from a healthy
            #     one to a status-only probe, because the catch-all answers 200
            #     either way — that is a limitation of httpGet, not of this path.
            #
            # The API is a separate Deployment with its own real probes since
            # §64.1. What actually catches a broken bundle is `npm run test:e2e`
            # in the SPA repo, or asserting that a fetched asset is NOT
            # byte-identical to index.html — something a probe cannot do.
            #
            # `port: http` resolves from the Service (the container declares no
            # ports:), so it lands on 80. `type` must sit at the PROBE level —
            # see §64.1 for the tcpSocket false friend this avoids.
            #
            # No startupProbe: a cold pod does log one expected
            # "Readiness probe failed: connection refused" before serve binds
            # port 80, and liveness allows 3x20s = 60s before a kill, so a slow
            # start cannot restart a healthy pod. Measured: that race resolves
            # sub-second.
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /
                spec:
                  port: http
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /
                spec:
                  port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 80
    ingress:
      app:
        enabled: true
        className: nginx
        annotations:
          hajimari.io/enable: "true"
          hajimari.io/appName: "Portfoliost"
          hajimari.io/icon: mdi:briefcase-outline
          hajimari.io/group: "pfire"
          hajimari.io/info: "Investment portfolio tracker"
          # Allow up to 1.1 GB for stooq zip uploads (N — /api/admin/jobs/stooq-import/upload)
          nginx.ingress.kubernetes.io/proxy-body-size: "1100m"
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  name: *app
                  port: *port
              - path: /api/auth
                service:
                  name: portfoliost-users-auth
                  port: 3000
              - path: /api/users
                service:
                  name: portfoliost-users-auth
                  port: 3000
              - path: /api/instruments
                service:
                  name: portfoliost-instruments
                  port: 3000
              - path: /api/logos
                service:
                  name: portfoliost-instruments
                  port: 3000
              - path: /api/wallets
                service:
                  name: portfoliost-wallets
                  port: 3000
              # §48 — fx_rates moved to instruments; the endpoints follow the data.
              - path: /api/currencies
                service:
                  name: portfoliost-instruments
                  port: 3000
              - path: /api/fx
                service:
                  name: portfoliost-instruments
                  port: 3000
              - path: /api/admin
                service:
                  name: portfoliost-admin
                  port: 3000
              - path: /api/portfolios
                service:
                  name: portfoliost-wallets
                  port: 3000
              - path: /api/labels
                service:
                  name: portfoliost-wallets
                  port: 3000
              - path: /api/positions
                service:
                  name: portfoliost-wallets
                  port: 3000
              - path: /api/news
                service:
                  name: portfoliost-instruments
                  port: 3000
        tls:
          - hosts:
              - *host
