# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-users-auth
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost-users-auth:
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-users-auth
              tag: v1.0.26
            # Override image CMD to skip db:seed — production starts empty,
            # migrations run at boot.
            command:
              - /bin/sh
              - -c
              - npm run db:migrate && node --import ./dist/iitm.js --import ./dist/instrumentation.js dist/server.js
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
              POCKETID_CLIENT_ID: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_TOKEN_URL: "http://pocket-id.networking.svc.cluster.local:1411/api/oidc/token"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            # §64.1 — `type`/`path`/`port` belong at the PROBE level in
            # app-template 5.x, not inside `spec`. These four had them under
            # `spec`, where the chart ignores them, so the probes were false
            # friends: rendered, accepted by the schema, and never actually
            # probing anything. Nothing in the cluster could restart a hung pod,
            # and readiness always passed.
            #
            # openst v1.1.36 is the working reference. One deliberate difference:
            # openst has a /ready that gates on Redis, these four do not (they
            # expose /health only), so readiness points at /health rather than at
            # a route that would 404 and take the pod out of rotation permanently.
            probes:
              # A cold pod's first DB and provider connect is slow, and with no
              # startupProbe that cost counts against liveness — which is how a
              # pod that is starting perfectly well gets killed for being slow.
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s

