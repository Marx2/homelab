---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-instruments
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost-instruments:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.67
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              CACHEST_URL: http://cachest.pfire.svc.cluster.local:8080
              LOGOS_DIR: /app/data/logos
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 10
                  periodSeconds: 15
              readiness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
      # Weekly refresh of the ticker reference table from
      # adanos/free-ticker-database (live GitHub data; boot seeds from the
      # bundled snapshot with --if-empty).
      tickersync:
        type: cronjob
        cronjob:
          schedule: "30 4 * * 1"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.67
            command: ["node", "dist/scripts/tickerref-sync.js"]
            env:
              NODE_ENV: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Daily Catalyst corp-bond catalogue sync (D80 25.3 / plan 35): scrapes the
      # single obligacje.pl listing via cachest /corp-bond/catalogue and upserts
      # into ticker_reference (asset_type=corp_bond, WSE:: keys only — never
      # touches stock/ETF rows, never deletes). Staggered after the 04:30
      # openst bond/CPI imports; the adanos tickersync (Mon 04:30) covers
      # disjoint listing keys. Delisted bonds linger (harmless).
      corpbondsync:
        type: cronjob
        cronjob:
          schedule: "45 4 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.67
            command: ["node", "dist/scripts/corp-bond-catalogue-sync.js"]
            env:
              NODE_ENV: production
              CACHEST_URL: "http://cachest:8080"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Daily FX import (fees-and-custom-fx D25): ECB publishes ~16:00 CET;
      # 17:10 UTC is safely after publication year-round. Moved from wallets —
      # fx_rates now lives in instruments (plan §48.6a).
      fxsync:
        type: cronjob
        cronjob:
          schedule: "10 17 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.67
            command: ["node", "dist/scripts/fx-sync.js"]
            env:
              NODE_ENV: production
              FRANKFURTER_BASE: https://api.frankfurter.dev/v1
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      # logos.md D35 — permanent local logo store (binaries on disc)
      logos:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: longhorn
        advancedMounts:
          portfoliost-instruments:
            app:
              - path: /app/data/logos
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
