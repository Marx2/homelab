---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-instruments
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost-instruments:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.22
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              CACHEST_URL: http://cachest.pfire.svc.cluster.local:8080
              LOGOS_DIR: /app/data/logos
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 10
                  periodSeconds: 15
              readiness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
      # Weekly refresh of the ticker reference table from
      # adanos/free-ticker-database (live GitHub data; boot seeds from the
      # bundled snapshot with --if-empty).
      tickersync:
        type: cronjob
        cronjob:
          schedule: "30 4 * * 1"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.23
            command: ["node", "dist/scripts/tickerref-sync.js"]
            env:
              NODE_ENV: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      # logos.md D35 — permanent local logo store (binaries on disc)
      logos:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: longhorn
        advancedMounts:
          portfoliost-instruments:
            app:
              - path: /app/data/logos
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
