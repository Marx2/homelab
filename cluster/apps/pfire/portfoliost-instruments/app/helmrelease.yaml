---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-instruments
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    # 10m, not the chart's 5m default. This pod mounts a ReadWriteOnce PVC, so a
    # deploy has to stop the old pod, wait for the volume to detach, then pull the
    # image and run `db:migrate` before it can report Ready. Observed 2026-10-06:
    # the v1.0.114 upgrade failed with `timeout waiting for:
    # [Deployment/pfire/portfoliost-instruments status: 'InProgress']`, which left
    # the Deployment on the previous strategy — a timeout here does not just fail
    # the deploy, it silently discards the fix you were deploying.
    timeout: 10m
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost-instruments:
        replicas: 1
        # maxSurge 0, and NOT `strategy: Recreate` (tried in #2236, reverted below).
        #
        # Why not Recreate: this chart renders a `rollingUpdate` stanza alongside
        # `strategy.type`, and Kubernetes rejects a Deployment carrying both:
        #   spec.strategy.rollingUpdate: Forbidden: may not be specified when
        #   strategy `type` is 'Recreate'
        # So `strategy: Recreate` is not expressible here. It failed four upgrades
        # in a row on 2026-10-06, Flux rolled back to v160 and Stalled.
        #
        # Why maxSurge 0: this pod mounts the `logos` PVC, which is
        # ReadWriteOnce. A default rolling update deadlocks on that — the new pod
        # cannot attach a volume the old pod still holds, and Kubernetes will not
        # stop the old pod until the new one is Ready. Observed on the v1.0.114
        # deploy: the new pod sat Pending for 4+ minutes on
        # `FailedAttachVolume: Multi-Attach error` until a manual
        # `kubectl delete pod` released the claim.
        #
        # With one replica and maxSurge 0 the old pod is deleted before the new one
        # is created, so the claim is released first — the behaviour Recreate was
        # wanted for, expressed in fields the chart and the API both accept.
        strategy: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.125
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              CACHEST_URL: http://cachest.pfire.svc.cluster.local:8080
              LOGOS_DIR: /app/data/logos
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              # §63.10 — second accepted credential: the wallets snapshot sweep
              # authenticates with this instead of a user JWT (serviceOrUserMiddleware).
              INSTRUMENTS_SERVICE_TOKEN: "${INSTRUMENTS_SERVICE_TOKEN}"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            # §64.1 — `type`/`path`/`port` belong at the PROBE level in
            # app-template 5.x, not inside `spec`. These four had them under
            # `spec`, where the chart ignores them, so the probes were false
            # friends: rendered, accepted by the schema, and never actually
            # probing anything. Nothing in the cluster could restart a hung pod,
            # and readiness always passed.
            #
            # openst v1.1.36 is the working reference. One deliberate difference:
            # openst has a /ready that gates on Redis, these four do not (they
            # expose /health only), so readiness points at /health rather than at
            # a route that would 404 and take the pod out of rotation permanently.
            probes:
              # A cold pod's first DB and provider connect is slow, and with no
              # startupProbe that cost counts against liveness — which is how a
              # pod that is starting perfectly well gets killed for being slow.
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
      # Weekly refresh of the ticker reference table from
      # adanos/free-ticker-database (live GitHub data; boot seeds from the
      # bundled snapshot with --if-empty).
      tickersync:
        type: cronjob
        cronjob:
          schedule: "30 4 * * 1"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.125
            command: ["node", "dist/scripts/tickerref-sync.js"]
            env:
              NODE_ENV: production
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Daily Catalyst corp-bond catalogue sync (D80 25.3 / plan 35): scrapes the
      # single obligacje.pl listing via cachest /corp-bond/catalogue and upserts
      # into ticker_reference (asset_type=corp_bond, WSE:: keys only — never
      # touches stock/ETF rows, never deletes). Staggered after the 04:30
      # openst bond/CPI imports; the adanos tickersync (Mon 04:30) covers
      # disjoint listing keys. Delisted bonds linger (harmless).
      corpbondsync:
        type: cronjob
        cronjob:
          schedule: "45 4 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.125
            command: ["node", "dist/scripts/corp-bond-catalogue-sync.js"]
            env:
              NODE_ENV: production
              CACHEST_URL: "http://cachest:8080"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Daily analizy.pl fund-category catalogue sync (plan §78): reads the
      # snapshot openst serves at /fund/catalogue and upserts ticker_reference
      # (asset_type=fund, ANALIZY:: keys only — never touches stock/ETF rows or
      # the WSE:: corp-bond rows, never deletes). Off-peak and staggered off the
      # 04:30 tickersync and 04:45 corpbondsync so the three upserts into one
      # table never contend.
      #
      # This job is load-bearing, not housekeeping: a fund category is routed and
      # searched by its ticker_reference row. With no ANALYZY:: row, ING01W
      # classifies as unknown -> stock -> the equity walk -> biznesradar -> 200
      # with zero bars. That silent shape is exactly what §72.39 was built to
      # stop, so the row must exist before anything routes on it. Codes that
      # leave the catalogue linger (harmless: their price fetch 404s upstream).
      fundcategorysync:
        type: cronjob
        cronjob:
          schedule: "15 5 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.125
            command: ["node", "dist/scripts/fund-category-catalogue-sync.js"]
            env:
              NODE_ENV: production
              CACHEST_URL: "http://cachest:8080"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Daily provider-backed stock split scan. It reads distinct open STOCK
      # positions, stages unsupported/ambiguous results for manual review, and
      # applies only confirmed OpenST events idempotently.
      splitsync:
        type: cronjob
        cronjob:
          schedule: "0 6 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.125
            command: ["node", "dist/scripts/split-sync.js"]
            env:
              NODE_ENV: production
              API_CACHEST_URL: "http://cachest:8080"
              API_WALLETS_URL: "http://portfoliost-wallets:3000"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Daily FX import (fees-and-custom-fx D25): ECB publishes ~16:00 CET;
      # 17:10 UTC is safely after publication year-round. Moved from wallets —
      # fx_rates now lives in instruments (plan §48.6a).
      fxsync:
        type: cronjob
        cronjob:
          schedule: "10 17 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-instruments
              tag: v1.0.125
            command: ["node", "dist/scripts/fx-sync.js"]
            env:
              NODE_ENV: production
              FRANKFURTER_BASE: https://api.frankfurter.dev/v1
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      # logos.md D35 — permanent local logo store (binaries on disc)
      logos:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: longhorn
        advancedMounts:
          portfoliost-instruments:
            app:
              - path: /app/data/logos
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
