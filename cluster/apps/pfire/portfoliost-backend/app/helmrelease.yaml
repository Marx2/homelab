# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-backend
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    controllers:
      portfoliost-backend:
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-backend
              tag: v1.0.0
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              DATABASE_URL: "file:/app/data/portfoliost.db"
              POCKETID_CLIENT_ID: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_TOKEN_URL: "https://pocket-id.${SECRET_DOMAIN}/oauth2/token"
              POCKETID_AUDIENCE: "portfoliost"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
            probes:
              liveness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 10
                  periodSeconds: 15
              readiness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
    service:
      app:
        controller: portfoliost-backend
        ports:
          http:
            port: 3000
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          portfoliost-backend:
            app:
              - path: /app/data
                readOnly: false
    imagePullSecrets:
      - regcred
