---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: pfire
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      redis:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            image:
              repository: ghcr.io/dragonflydb/dragonfly
              tag: v2.0.2
            command:
              - dragonfly
            args:
              - --requirepass=$(REDIS_PASSWORD)
              - --bind=0.0.0.0
              - --dir=/data
              - --dbfilename=dump
              # Must stay >= 256MiB x proactor_threads or Dragonfly refuses to
              # start ("There are N threads, so X are required. Exiting...").
              # proactor_threads is pinned so node CPU count cannot change the floor.
              - --maxmemory=512mb
              - --cache_mode=true
              - --proactor_threads=2
              - --num_shards=1
              - --max_eviction_per_heartbeat=1000
            env:
              REDIS_REPLICATION_MODE: master
              REDIS_PASSWORD: ${SECRET_REDIS_PASS}
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 512Mi
    persistence:
      data:
        enabled: true
        existingClaim: redis-pvc
        globalMounts:
          - path: /data
            subPath: dragonfly
    service:
      main:
        controller: redis
        ports:
          redis:
            enabled: true
            port: 6379
