---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mastra-ticker
  namespace: flux-system
spec:
  targetNamespace: pfire
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./cluster/apps/pfire/mastra-ticker/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  postBuild:
    substitute:
      APP: *app
