---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jobshot
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: true
    controllers:
      jobshot:
        replicas: 1
        annotations:
          configmap.reloader.stakater.com/reload: &config jobshot-jobs
        containers:
          app:
            image:
              repository: ghcr.io/marx2/jobshot
              tag: 1.7.0
            env:
              APP_TIMEZONE: ${TZ}
            # §64.4 — jobshot had no probes, and until 1.7.0 it could not have
            # had a working one: every non-/api/ path falls through to the SPA
            # fallback and returns dist/index.html, so /health and /ready both
            # answered 200 with the 454-byte shell, byte-identical to /. Any
            # HTTP probe here was a no-op that could never fail.
            #
            # 1.7.0 adds both routes above the fallback. /health is liveness and
            # touches nothing — the Kubernetes API is a network dependency, and a
            # liveness probe that fails during an API blip would restart-loop a
            # pod whose UI is fine, and restarting it cannot fix the API server.
            # /ready checks only local files (dist/index.html, config/jobs.yaml),
            # so it cannot flap on an upstream.
            #
            # NOT on KEDA, despite the orphaned httpscaledobject.yaml and
            # interceptor-service.yaml sitting in this directory: neither is
            # listed in kustomization.yaml resources, so Flux never applies them,
            # there is no ScaledObject in the cluster, replicas is 1 rather than
            # 0, and the ingress below points at the app service rather than the
            # interceptor proxy. Only investbrain, pgweb and scanst-ui are
            # genuinely on KEDA. (scorest carries the same dead files.)
            # If that is ever wired up, replicas must become 0, a startupProbe
            # becomes mandatory, and liveness becomes near-pointless on a pod
            # that is deleted when idle.
            #
            # `port: http` resolves from the Service; `type` must sit at the
            # PROBE level — see §64.1 for the tcpSocket false friend.
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /ready
                spec:
                  port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 3000
    ingress:
      app:
        enabled: true
        className: nginx
        annotations:
          hajimari.io/appName: "Jobshot"
          hajimari.io/icon: mdi:cash
          hajimari.io/enable: "true"
          hajimari.io/info: UI to run Kubernetes jobs.
          nginx.ingress.kubernetes.io/auth-url: "https://auth.${SECRET_DOMAIN}/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: https://auth.${SECRET_DOMAIN}/oauth2/start
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  name: jobshot
                  port: 3000
        tls:
          - hosts:
              - *host
    serviceAccount:
      jobshot:
        enabled: true

    rbac:
      roles:
        jobshot:
          # -- Enables or disables the Role. Can be templated.
          enabled: true
          # -- Set to Role,ClusterRole
          type: Role
          rules:
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["create","get","list","watch","delete"]
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get","list","watch"]
            - apiGroups: [""]
              resources: ["namespaces"]
              verbs: ["get","list"]
      bindings:
        jobshot:
          # -- Enables or disables the Role. Can be templated.
          enabled: true
          # -- Set to RoleBinding,ClusterRoleBinding
          type: RoleBinding
          # -- Can be an identifier of rbac.roles or a custom name and kind
          roleRef:
            name: jobshot
            kind: Role
            apiGroup: rbac.authorization.k8s.io
          # -- If using an identifier it will be automatically filled, otherwise every key will need to be explicitly declared
          subjects:
            - kind: ServiceAccount
              name: jobshot
              namespace: "{{ .Release.Namespace }}"
    persistence:
      config-file:
        type: configMap
        name: *config
        globalMounts:
          - path: /app/config/jobs.yaml
            subPath: jobs.yaml
            readOnly: true