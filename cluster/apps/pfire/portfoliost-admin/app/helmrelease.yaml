# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-admin
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
      # D46 — read CronJob/Deployment image tags live for the System tab
      automountServiceAccountToken: true
      nodeSelector:
        kubernetes.io/hostname: kaczka
    controllers:
      portfoliost-admin:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-admin
              tag: v1.0.71
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              # D55 — topology live status: query in-cluster Prometheus
              # (kube-state-metrics k8s metrics) for replica/restart health,
              # and the SPA's ingress virtual host for the nginx-gateway
              # aggregate traffic (topology follow-up).
              PROMETHEUS_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
              INGRESS_APP_HOST: "portfoliost.k.homylab.com"
              # strict JWT validation (cluster)
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              API_USERS_AUTH_URL: http://portfoliost-users-auth.pfire.svc.cluster.local:3000
              API_WALLETS_URL: http://portfoliost-wallets.pfire.svc.cluster.local:3000
              API_INSTRUMENTS_URL: http://portfoliost-instruments.pfire.svc.cluster.local:3000
              # D46 — provider-tier versions in the admin System tab
              API_OPENST_URL: http://openst.pfire.svc.cluster.local:8080
              API_CACHEST_URL: http://cachest.pfire.svc.cluster.local:8080
              # N — stooq import jobs
              API_JOBSHOT_URL: http://jobshot.pfire.svc.cluster.local:3000
              # D24 f/up — Google Sheets sync Job image (plan §28.6 re-import);
              # pinned here, not in portfoliost-admin (env override of the code default)
              SHEETS_SYNC_IMAGE: ghcr.io/marx2/portfoliost-sheets-sync:v1.0.46
              # §72 — the price-audit Job runs the WALLETS image, since the script lives
              # beside valuation-audit. MUST move in step with the wallets HelmRelease
              # (cluster/apps/pfire/portfoliost-wallets): a Job on an older wallets image
              # would run an older audit, or not find the script at all.
              WALLETS_IMAGE: ghcr.io/marx2/portfoliost-wallets:v1.1.164
              # §72.24 — the FX-backfill Job runs the INSTRUMENTS image (the
              # `fx-backfill` script lives there, beside fx-sync). MUST move in
              # step with the instruments HelmRelease: this Job writes the
              # fx_rates table every converted price depends on, and an unpinned
              # tag would let a release change what it wrote mid-run.
              INSTRUMENTS_IMAGE: ghcr.io/marx2/portfoliost-instruments:v1.0.126
              STOOQ_UPLOAD_DIR: /tmp/stooq-uploads
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
              # D48b/D49 — identity fetched live from the PocketID Admin API;
              # the static API key is mirrored from networking via Reflector.
              # See portfoliost-admin/README.md for setup details.
              POCKETID_BASE_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_ADMIN_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: pocket-id-static-api-key
                    key: token
              # D49 — OIDC client-credentials for UserInfo enrichment (optional;
              # unset until the portfoliost-admin PocketID client is registered)
              # OIDC_ISSUER_URL / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET come from
              # the operator-generated secret when provisioned.
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                # Raised from 256Mi: upload route streams to disk but node
                # still needs headroom for the busboy parse buffers + app overhead.
                memory: 512Mi
            # §64.1 — `type`/`path`/`port` belong at the PROBE level in
            # app-template 5.x, not inside `spec`. These four had them under
            # `spec`, where the chart ignores them, so the probes were false
            # friends: rendered, accepted by the schema, and never actually
            # probing anything. Nothing in the cluster could restart a hung pod,
            # and readiness always passed.
            #
            # openst v1.1.36 is the working reference. One deliberate difference:
            # openst has a /ready that gates on Redis, these four do not (they
            # expose /health only), so readiness points at /health rather than at
            # a route that would 404 and take the pod out of rotation permanently.
            probes:
              # A cold pod's first DB and provider connect is slow, and with no
              # startupProbe that cost counts against liveness — which is how a
              # pod that is starting perfectly well gets killed for being slow.
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000

    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s

    persistence:
      stooq-upload:
        type: persistentVolumeClaim
        existingClaim: stooq-upload-pvc
        globalMounts:
          - path: /tmp/stooq-uploads
