---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/fluxcd-schemas/main/kustomize-kustomization-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app portfoliost-admin
  namespace: flux-system
spec:
  targetNamespace: pfire
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./cluster/apps/pfire/portfoliost-admin/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
