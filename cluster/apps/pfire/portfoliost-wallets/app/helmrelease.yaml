# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-wallets
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost-wallets:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-wallets
              tag: v1.0.22
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              # strict JWT validation (cluster); dev bearer fallback never reached
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              USERS_AUTH_URL: http://portfoliost-users-auth.pfire.svc.cluster.local:3000
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 10
                  periodSeconds: 15
              readiness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
      # Daily FX import (fees-and-custom-fx D25): ECB publishes ~16:00 CET;
      # 17:10 UTC is safely after publication year-round.
      fxsync:
        type: cronjob
        cronjob:
          schedule: "10 17 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-wallets
              tag: v1.0.22
            command: ["node", "dist/scripts/fx-sync.js"]
            env:
              NODE_ENV: production
              FRANKFURTER_BASE: https://api.frankfurter.dev/v1
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
