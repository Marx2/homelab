# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-wallets
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost-wallets:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-wallets
              tag: v1.1.150
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              # §63.6/§63.10 — the per-symbol recalculation debug logs this enabled
              # are off. The RCA they were opened for is closed, and they fire on
              # every day of every recompute.
              RECALC_DEBUG: "0"
              # strict JWT validation (cluster); dev bearer fallback never reached
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              USERS_AUTH_URL: http://portfoliost-users-auth.pfire.svc.cluster.local:3000
              INSTRUMENTS_URL: http://portfoliost-instruments.pfire.svc.cluster.local:3000
              # §63.10 — required: the sweep has no user identity, so without this
              # every instruments call is rejected and the pass is refused.
              INSTRUMENTS_SERVICE_TOKEN: "${INSTRUMENTS_SERVICE_TOKEN}"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            # §64.1 — `type`/`path`/`port` belong at the PROBE level in
            # app-template 5.x, not inside `spec`. These four had them under
            # `spec`, where the chart ignores them, so the probes were false
            # friends: rendered, accepted by the schema, and never actually
            # probing anything. Nothing in the cluster could restart a hung pod,
            # and readiness always passed.
            #
            # openst v1.1.36 is the working reference. One deliberate difference:
            # openst has a /ready that gates on Redis, these four do not (they
            # expose /health only), so readiness points at /health rather than at
            # a route that would 404 and take the pod out of rotation permanently.
            probes:
              # A cold pod's first DB and provider connect is slow, and with no
              # startupProbe that cost counts against liveness — which is how a
              # pod that is starting perfectly well gets killed for being slow.
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
      # Scheduled additive value-snapshot refresh (2026-09-27): prices every
      # portfolio from quotes, then re-values the last two days (upsert, never
      # deletes). This is the ONLY writer of positions.market_value in the
      # scheduled pipeline now that reads stopped pricing (§76.1), so if this job
      # stops, position prices go stale until a write re-prices them.
      #
      # ONE CronJob, deliberately (2026-10-01). There used to be two identical
      # objects, mid-day and post-FX, and merging them was the obvious cleanup —
      # but this cluster's API server (k3s v1.36.2) rejects a comma-separated
      # `schedule`:
      #   spec.schedule: Invalid value: "0 13 * * *, 20 17 * * *":
      #   expected exactly 5 fields, found 10
      # so a single object could not hold both windows.
      #
      # The cost of dropping to one window: the post-FX pass (after the 17:10
      # CEST fxsync settles the ECB rate that finalises the day's converted
      # values) is gone, so day-end converted values settle on the next morning's
      # run instead of the same evening. Accepted over the alternative, which was
      # two objects whose `concurrencyPolicy: Forbid` never covered both windows —
      # a slow morning pass could still be running when the evening one started,
      # both writing prices for the same portfolio. One object makes the guard
      # mean what it reads as.
      #
      # Schedules are CONTROLLER-LOCAL (spec.timeZone unset, cluster on
      # CEST/UTC+2), so this fires at 11:00 UTC — verified against
      # status.lastScheduleTime, not inferred from the spec.
      snapshotsync:
        type: cronjob
        cronjob:
          schedule: "0 13 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-wallets
              tag: v1.1.150
            command: ["node", "dist/scripts/snapshots-sync.js"]
            env:
              NODE_ENV: production
              INSTRUMENTS_URL: http://portfoliost-instruments.pfire.svc.cluster.local:3000
              # §63.10 — required: no user identity, so no service token means no prices.
              INSTRUMENTS_SERVICE_TOKEN: "${INSTRUMENTS_SERVICE_TOKEN}"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: portfoliost-wallets
        ports:
          http:
            port: 3000
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
