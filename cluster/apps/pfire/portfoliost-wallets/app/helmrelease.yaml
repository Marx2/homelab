# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app portfoliost-wallets
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      interval: 15m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
    ignore:
      - paths: [/spec/containers/resources/limits]
        target:
          kind: Pod
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      portfoliost-wallets:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-wallets
              tag: v1.1.65
            env:
              PORT: "3000"
              HOST: "0.0.0.0"
              NODE_ENV: production
              # temporary: per-symbol recalculation debug logs (observe 09-25→09-26 IBKR jump)
              RECALC_DEBUG: "1"
              # strict JWT validation (cluster); dev bearer fallback never reached
              POCKETID_ISSUER_URL: "https://pocket-id.${SECRET_DOMAIN}"
              POCKETID_AUDIENCE: "${PORTFOLIOST_OIDC_CLIENT_ID}"
              USERS_AUTH_URL: http://portfoliost-users-auth.pfire.svc.cluster.local:3000
              INSTRUMENTS_URL: http://portfoliost-instruments.pfire.svc.cluster.local:3000
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            probes:
              liveness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 10
                  periodSeconds: 15
              readiness:
                enabled: true
                spec:
                  path: /health
                  port: http
                  initialDelaySeconds: 5
                  periodSeconds: 10
      # Scheduled additive value-snapshot refresh (2026-09-27): re-values the
      # last two days for every portfolio (upsert, never deletes). Twice a
      # day — mid-day and after instruments fxsync (17:10 UTC, the ECB rate
      # that finalizes the day's converted values). Overrides stale live-quote
      # snapshot values while §63.2 (unified valuation) is open.
      snapshotsync:
        type: cronjob
        cronjob:
          schedule: "0 13 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-wallets
              tag: v1.1.65
            command: ["node", "dist/scripts/snapshots-sync.js"]
            env:
              NODE_ENV: production
              INSTRUMENTS_URL: http://portfoliost-instruments.pfire.svc.cluster.local:3000
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      snapshotsync-postfx:
        type: cronjob
        cronjob:
          schedule: "20 17 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/portfoliost-wallets
              tag: v1.1.65
            command: ["node", "dist/scripts/snapshots-sync.js"]
            env:
              NODE_ENV: production
              INSTRUMENTS_URL: http://portfoliost-instruments.pfire.svc.cluster.local:3000
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-portfoliost
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 3000
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
