---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cachest
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  values:
    global:
      createDefaultServiceAccount: false
    controllers:
      cachest:
        replicas: 1
        annotations:
          configmap.reloader.stakater.com/reload: &config cachest-config
        containers:
          app:
            image:
              repository: ghcr.io/marx2/cachest
              tag: v1.0.49
            env:
              TZ: "${TZ}"
              # Redis connection comes from the mounted cachest-config configmap
              # (host/port/password/db, password via ${SECRET_REDIS_PASS}). The
              # REDIS_HOST/PORT/DB/PASSWORD env vars that used to live here were
              # identical to those file values, so they were a second, silently
              # ignored source of truth — config.py never read PORT or DB at all.
            envFrom:
              - secretRef:
                  name: cachest-secrets
            # v1.0.47 fixes RateLimiter's _last_fetch=0.0 sentinel, which
            # rejected every caller for the first `interval` seconds whenever
            # time.monotonic() starts near zero. Low risk (it only changes the
            # never-fetched case) but real, so this pin moves with it.
            #
            # §64.2 — cachest had no probes at all, so a wedged event loop kept
            # serving 200s forever. openst v1.1.36 is the working reference for
            # the shape: `type`/`path`/`port` belong at the PROBE level in
            # app-template 5.x, not inside `spec` (see §64.1 — putting them in
            # `spec` renders a schema-valid tcpSocket false friend).
            #
            # liveness is /health on purpose: cachest's /health never touches
            # Redis, and a dependency-aware *liveness* probe would restart-loop
            # the pod during a cache blip — which cannot fix the cache, it only
            # removes the one pod still answering.
            #
            # readiness is /ready (added in cachest v1.0.45), 503 while Redis is
            # unreachable. RedisCache.get/set degrade to cache misses, so without
            # it the pod stays in rotation and every request pays a full upstream
            # walk. This is the one pfire service where readiness is not a
            # duplicate of liveness.
            #
            # The tag bump is load-bearing, not cosmetic: a rollback to v1.0.44 or
            # older 404s /ready, and a probe against a 404 never passes, so the pod
            # would sit at 0/1 forever rather than serving.
            probes:
              # lifespan runs stats.load_from_redis before the server accepts
              # traffic, and a cold pod's first Redis connect is not instant.
              # Without this, that cost counts against liveness and a pod that is
              # starting perfectly well gets killed for being slow.
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  port: http
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /ready
                spec:
                  port: http
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
    ingress:
      app:
        enabled: true
        className: nginx
        annotations:
          hajimari.io/appName: "Cachest"
          hajimari.io/icon: mdi:cached
          hajimari.io/enable: "true"
          hajimari.io/info: HTTP caching proxy for financial data.
          # §63.11 — cachest is a pfire *internal* tier: it has no application
          # auth of its own, and instruments -> cachest -> openst -> provider
          # keys is a chain with exactly one check at its front. That is fine
          # in-cluster (every caller uses the ClusterIP, which nginx never
          # sees) and wrong from a browser. This is the same oauth2-proxy auth
          # subrequest pgweb / scanst / stooq / jobshot already use, so browser
          # traffic is gated and the scheduled jobs are untouched.
          nginx.ingress.kubernetes.io/auth-url: "https://auth.${SECRET_DOMAIN}/oauth2/auth"
          nginx.ingress.kubernetes.io/auth-signin: "https://auth.${SECRET_DOMAIN}/oauth2/start"
        hosts:
          - host: &host "cachest.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      config-file:
        type: configMap
        name: *config
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
