# cachest route config (cluster).
#
# fetch_interval / fetch_max_wait are a PAIR, and the pair sets a concurrency cap:
# RateLimiter claims its slot as `last = now + sleep`, so the Nth waiter sleeps
# N * fetch_interval. fetch_max_wait is therefore a *total queueing budget*, and the
# depth it admits is
#
#     queue_depth = floor(fetch_max_wait / fetch_interval) + 1
#
# Anything past that depth is rejected with an instant 503 and NO upstream call.
# A route's depth must exceed the widest concurrent burst its callers produce — a
# single portfolio sweep is 175+ symbols, so the symbol-keyed openst routes sit at
# 600 (a 175-symbol sweep then waits at most ~35s). The 2/4 default that most routes
# used to ship is depth 3 and starves everything past the third caller; see plan §63.9.
# Keep in sync with the cachest repo's config.yaml, which differs only in the openst
# host (short name locally, FQDN in-cluster) — the interval/max_wait values must match.
redis:
  host: redis              # shared namespace instance (§13) — ghostfolio on db0
  port: 6379
  password: ${SECRET_REDIS_PASS}
  db: 1

routes:
  - name: DIVIDENDHISTORY
    path: /dyhistory/{ticker}
    url: "https://dividendhistory.org/payout/{ticker}/"
    extract:
      selector: "dl.metrics-list .metric-row"
      label: "Yield"
      field: "dd"
    cache_ttl: 86400          # seconds (24h)
    stale_ttl: 2592000        # seconds (30 days) — max age for stale fallback
    fetch_interval: 2 # min seconds between remote fetches
    fetch_max_wait: 120 # max queue wait before falling back to stale

  - name: OPENST
    path: /dy/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/dividend/yield/{ticker}"
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_PRICE_HISTORY
    path: /price/history/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/price/history/{ticker}"
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: ALPHAVANTAGE
    path: /dy3/{ticker}
    url: "https://www.alphavantage.co/query?function=OVERVIEW&symbol={ticker}&apikey={api_key}"
    json_field: DividendYield
    daily_limit: 25
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 2
    fetch_max_wait: 120

  - name: FMP
    path: /dy2/{ticker}
    url: "https://financialmodelingprep.com/api/v3/profile/{ticker}?apikey={api_key}"
    daily_limit: 250          # max upstream fetches per calendar day; 0 = unlimited
    cache_ttl: 86400
    stale_ttl: 2592000
    fetch_interval: 2
    fetch_max_wait: 120

