    cache_ttl: 21600           # 6h — today's bar keeps updating
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120
    fetch_timeout: 120         # biznesradar multi-page scrape can take ~20s

  - name: OPENST_OHLCV_FUNDS
    path: /ohlcv/fund/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/price/ohlcv/{ticker}?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 86400           # 24h — NAV updates once per business day
    stale_ttl: 2592000
    fetch_interval: 0.5 # 60s min between upstream fetches
    fetch_max_wait: 120
    fetch_timeout: 120         # biznesradar multi-page scrape can take ~20s

  - name: OPENST_FUNDAMENTALS
    path: /fundamentals/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/equity/fundamentals/{ticker}?statement={statement}&period={period}"
    query_params: [statement, period]
    cache_ttl: 86400           # 24h
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_CALENDAR_EARNINGS
    path: /calendar/earnings
    url: "http://openst.pfire.svc.cluster.local:8080/equity/calendar/earnings?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 3600            # 1h — consensus figures get revised
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_CALENDAR_DIVIDEND
    path: /calendar/dividend
    url: "http://openst.pfire.svc.cluster.local:8080/equity/calendar/dividend?start={start}&end={end}"
    query_params: [start, end]
    cache_ttl: 3600            # 1h
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_SEARCH
    path: /equity/search/{query}
    url: "http://openst.pfire.svc.cluster.local:8080/equity/search/{query}"
    cache_ttl: 604800          # 7d — universe changes rarely
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_DIVIDENDS
    path: /dividends/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/dividend/history/{ticker}"
    # 7d, was 24h. The instruments Postgres store owns dividend freshness: it
    # persists history + predicted rows and only asks again when its 7d
    # history/prediction windows or the 7d empty backoff say so
    # (pfire-docs #71). This TTL no longer decides how fresh the data is, only
    # how often a cold cache re-walks the providers.
    cache_ttl: 604800
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  # --- logo resolution (logos.md D36) — caches the lookup only; binaries are stored by the instruments module ---

  - name: OPENST_LOGO
