    cache_ttl: 604800          # 7d — static company facts
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_QUOTE
    path: /equity/quote/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/equity/quote/{ticker}"
    cache_ttl: 300             # 5min — live-ish quote
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_METRICS
    path: /equity/metrics/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/equity/metrics/{ticker}"
    cache_ttl: 86400           # 24h
    stale_ttl: 2592000
    fetch_interval: 0.2
    fetch_max_wait: 120

  - name: OPENST_SPLITS
    path: /splits/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/equity/splits/{ticker}"
