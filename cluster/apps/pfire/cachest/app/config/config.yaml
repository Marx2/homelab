  - name: OPENST_CRYPTO_QUOTE
    path: /crypto/quote/{pair}
    url: "http://openst.pfire.svc.cluster.local:8080/crypto/quote/{pair}"
    cache_ttl: 21600           # 6h — quote derived from latest OHLCV bar
    stale_ttl: 2592000
