    path: /news/company/{ticker}
    url: "http://openst.pfire.svc.cluster.local:8080/news/company/{ticker}?start_date={start_date}&limit={limit}"
    query_params: [start_date, limit]
    cache_ttl: 3600            # 1h fresh
    stale_ttl: 86400           # 24h stale fallback
    fetch_interval: 300        # 5min between upstream fetches
