  # --- crypto via openbb-crypto (D78 step 18, 2026-09-15) ---

  - name: OPENST_CRYPTO_OHLCV
    path: /crypto/ohlcv/{pair}
    url: "http://openst.pfire.svc.cluster.local:8080/crypto/ohlcv/{pair}?start={start}&end={end}"
