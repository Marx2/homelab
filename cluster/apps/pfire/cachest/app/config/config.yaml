    path: /fixedincome/search/{query}
    url: "http://openst.pfire.svc.cluster.local:8080/fixedincome/search/{query}"
    cache_ttl: 3600            # 1h — bond emissions catalogue lookup
    stale_ttl: 2592000
    fetch_interval: 0.2
