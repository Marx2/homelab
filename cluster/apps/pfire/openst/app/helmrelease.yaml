---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openst
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      openst:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/marx2/openst
              tag: v1.1.22
            env:
              TZ: "${TZ}"
              REDIS_HOST: redis
              REDIS_PORT: "6379"
              REDIS_PASSWORD: ${SECRET_REDIS_PASS}
              REDIS_DB: "2"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-openst
                    key: uri
            envFrom:
              - secretRef:
                  name: openst-secrets
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Daily CPI import (D79): GUS publishes the 12m CPI ~mid-month; obligacje.pl
      # mirrors it shortly after. 04:30 UTC daily keeps cpi_12m fresh. The
      # importer increments only the last 60 days; the cluster is seeded by the
      # openst-cpi-seed Job (--mode full).
      cpi-import:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/openst
              tag: v1.1.22
            command: ["python", "-m", "src.importers.cpi", "--mode", "incremental"]
            env:
              TZ: "${TZ}"
              PYTHONUNBUFFERED: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-openst
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
    ingress:
      app:
        enabled: true
        className: nginx
        annotations:
          hajimari.io/appName: "OpenST"
          hajimari.io/icon: mdi:finance
          hajimari.io/enable: "true"
          hajimari.io/info: OpenBB dividend data proxy.
        hosts:
          - host: &host "openst.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  name: openst
                  port: 8080
        tls:
          - hosts:
              - *host
