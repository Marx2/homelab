---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openst
  namespace: pfire
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  values:
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      imagePullSecrets:
        - name: regcred
    controllers:
      openst:
        replicas: 2
        containers:
          app:
            image:
              repository: ghcr.io/marx2/openst
              tag: v1.1.38
            env:
              TZ: "${TZ}"
              REDIS_HOST: redis
              REDIS_PORT: "6379"
              REDIS_PASSWORD: ${SECRET_REDIS_PASS}
              REDIS_DB: "2"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-openst
                    key: uri
            envFrom:
              - secretRef:
                  name: openst-secrets
            # No probes existed before. /health is liveness only (it never touches
            # Redis or Postgres, so a Redis blip cannot restart-loop the pod);
            # /ready is readiness and reports 503 when Redis is unreachable, taking
            # the pod out of rotation rather than serving 2-15s provider walks.
            # The startup probe is generous because lifespan runs schema migrations
            # before the server accepts traffic. app-template 5.x nests these under
            # containers.<name>.probes.<probe> and requires enabled: true; the port
            # is resolved from the primary service.
            probes:
              startup:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  periodSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                type: HTTP
                path: /health
                spec:
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                type: HTTP
                path: /ready
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
            resources:
              requests:
                cpu: 50m
                # §73 — raised from 128Mi. The request matters as much as the
                # limit: at 128Mi the scheduler happily packs openst beside
                # other work, and it is then the first thing killed. Both
                # replicas were OOMKilled (137) at 700Mi.
                memory: 512Mi
              limits:
                # §73 — raised from 700Mi, and it is a DELAY not a fix.
                # Prometheus (container_memory_working_set_bytes, 24h) shows a
                # monotonic climb with no return to baseline: a fresh container
                # floors at ~405-423Mi, then 543→692 and 613→698 over 18h until
                # the ceiling is hit and the process is killed. Memory is
                # retained across requests, not freed — one 30-minute step went
                # 442→684Mi during a per-symbol /equity/logo + /fixedincome/search
                # sweep. 2Gi buys roughly 3× the time; the leak is §73's subject.
                #
                # Scaling replicas does NOT fix this: each process leaks at the
                # same rate, and 3 replicas would raise the idle floor to
                # ~1.26Gi. An HPA on memory would be actively harmful — it would
                # add replicas *because* memory is high and never converge.
                memory: 2Gi
      # Daily CPI import (D79): GUS publishes the 12m CPI ~mid-month; obligacje.pl
      # mirrors it shortly after. 04:30 UTC daily keeps cpi_12m fresh. The
      # importer increments only the last 60 days; the table was seeded by the
      # suspended cpi-seed CronJob below.
      cpi-import:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/openst
              tag: v1.1.38
            command: ["python", "-m", "src.importers.cpi", "--mode", "incremental"]
            env:
              TZ: "${TZ}"
              PYTHONUNBUFFERED: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-openst
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
      # Daily savings-bond refresh (D79 22): new emissions go on sale on the 1st
      # of each month, so a daily pass over the live offer page catches every one
      # inside its sale window. The importer enumerates from the site (it never
      # guesses symbols), so a run is self-discovering and idempotent — 8 rows
      # parsed, 0 inserted on an unchanged day.
      bond-import:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/openst
              tag: v1.1.38
            command: ["python", "-m", "src.importers.bond_series", "--mode", "incremental"]
            env:
              TZ: "${TZ}"
              PYTHONUNBUFFERED: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-openst
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
      # Monthly full re-enumeration (D79 22): re-scrapes the whole /listy-emisyjne/
      # catalogue (~449 pages, ~11 min) as the self-healing backstop for anything
      # the daily pass missed (e.g. an outage over a full sale window). Runs on the
      # 3rd, after the 1st-of-month sale is published. ON CONFLICT DO NOTHING, so a
      # missed run converges on the next one.
      bond-archive:
        type: cronjob
        cronjob:
          schedule: "0 6 3 * *"
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/openst
              tag: v1.1.38
            command: ["python", "-m", "src.importers.bond_series", "--mode", "archive"]
            env:
              TZ: "${TZ}"
              PYTHONUNBUFFERED: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-openst
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
      # One-shot full-history CPI seed (D79 19.3), kept declarative but suspended:
      # a Job would re-run on every Flux sync (the raw Job this replaces was
      # recreated by kustomize after its TTL self-delete). CronJob templates are
      # mutable, so tag bumps never wedge the HelmRelease. Run it by hand with:
      #   kubectl -n pfire create job openst-cpi-seed-$(date +%m%d) --from=cronjob/openst-cpi-seed
      cpi-seed:
        type: cronjob
        cronjob:
          schedule: "0 5 1 1 *" # never on its own — suspended below
          suspend: true
          concurrencyPolicy: Forbid
        containers:
          app:
            image:
              repository: ghcr.io/marx2/openst
              tag: v1.1.38
            command: ["python", "-m", "src.importers.cpi", "--mode", "full"]
            env:
              TZ: "${TZ}"
              PYTHONUNBUFFERED: "1"
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: postgres-pfire-pguser-openst
                    key: uri
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    serviceMonitor:
      app:
        enabled: true
        service:
          identifier: app
        endpoints:
          - port: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s
    ingress:
      app:
        enabled: true
        className: nginx
        annotations:
          hajimari.io/appName: "OpenST"
          hajimari.io/icon: mdi:finance
          hajimari.io/enable: "true"
          hajimari.io/info: OpenBB dividend data proxy.
        hosts:
          - host: &host "openst.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  name: openst
                  port: 8080
        tls:
          - hosts:
              - *host
