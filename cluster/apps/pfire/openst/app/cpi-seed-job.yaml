---
# One-shot CPI seed (D79 19.3): --mode full pulls MAX history (Jan 2000->now)
# into openst.cpi_12m. Idempotent (ON CONFLICT DO NOTHING), so it self-heals on
# recreate. Self-deletes via ttlSecondsAfterFinished; daily freshness comes from
# the cpi-import CronJob in helmrelease.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: openst-cpi-seed
  namespace: pfire
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openst
        job: cpi-seed
    spec:
      imagePullSecrets:
        - name: regcred
      restartPolicy: Never
      containers:
        - name: cpi-seed
          image: ghcr.io/marx2/openst:v1.1.20
          command: ["python", "-m", "src.importers.cpi", "--mode", "full"]
          env:
            - name: TZ
              value: "${TZ}"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-pfire-pguser-openst
                  key: uri
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi